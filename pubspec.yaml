name: eazy_manage
description: "Flutter desktop app for eazy manage"
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  connectivity_plus: ^6.1.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^8.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.0

flutter:

  uses-material-design: true

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans_24pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans_24pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans_24pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans_24pt-Bold.ttf
          weight: 700
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500